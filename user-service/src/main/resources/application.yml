spring:
    application:
        name: user-service
    datasource:
        driver-class-name: org.postgresql.Driver
        password: 1234
        url: jdbc:postgresql://localhost:5432/postgres
        username: postgres
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
        show-sql: true
server:
    port: 8080